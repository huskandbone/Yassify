# Raise <Version> in Yassify/Yassify.csproj, add a "## X.Y.Z" section to CHANGELOG.md and push (or press "Run workflow"
# under Actions > Release): this builds Yassify, makes a GitHub release vX.Y.Z with latest.zip and that section as its
# notes, and bumps repo.json (with the same notes) so everyone who added the repo to Dalamud gets the update. A version
# that already has a release is skipped; a version with no CHANGELOG.md section stops before releasing.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "Yassify/Yassify.csproj"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Yassify/Yassify.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.new == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Get Dalamud
        if: steps.ver.outputs.new == 'true'
        run: |
          curl -sSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$RUNNER_TEMP/dalamud"
          unzip -q dalamud.zip -d "$RUNNER_TEMP/dalamud"
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud/" >> "$GITHUB_ENV"

      - name: Build
        if: steps.ver.outputs.new == 'true'
        run: dotnet build Yassify/Yassify.csproj -c Release

      - name: Release notes (this version's part of CHANGELOG.md)
        if: steps.ver.outputs.new == 'true'
        run: python3 scripts/changelog.py "${{ steps.ver.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Yassify ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Yassify/bin/Release/Yassify/latest.zip
          body_path: ${{ runner.temp }}/notes.md

      - name: Update repo.json on main
        if: steps.ver.outputs.new == 'true'
        run: |
          cp Yassify/bin/Release/Yassify/Yassify.json "$RUNNER_TEMP/built.json"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          python3 scripts/update_repo_json.py "$RUNNER_TEMP/built.json" "$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet || git commit -m "repo.json: v${{ steps.ver.outputs.version }}"
          git push origin main
